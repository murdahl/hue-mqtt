[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hue-mqtt"
version = "0.1.0"
description = "Publish Philips Hue lights, rooms and switches to MQTT via the bridge's local API (live event stream), with optional control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "paho-mqtt>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hue-mqtt = "hue_mqtt.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
